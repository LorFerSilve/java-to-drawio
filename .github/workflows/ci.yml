name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test the executable JAR
        run: mvn --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-to-drawio-${{ matrix.os }}
          path: target/java-to-drawio.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-to-drawio-ubuntu-latest
          path: dist
      - name: Check the version and publish the tested JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a vMAJOR.MINOR.PATCH tag, got $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          jar=dist/java-to-drawio.jar
          if ! unzip -p "$jar" META-INF/maven/io.github.lorfersilve/java-to-drawio/pom.properties |
              grep -Fx "version=$version"; then
            echo "The tag $TAG must match the Maven version in the tested JAR" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$version]" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "CHANGELOG.md is missing release notes for $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" "$jar" --verify-tag --title "Java to Draw.io $TAG" --notes-file "$notes"
